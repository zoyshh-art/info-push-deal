name: 手机好价监控

on:
  schedule:
    # 每小时触发一次，job 内部自己循环 25 轮 × 2 分钟 ≈ 50 分钟，留 10 分钟缓冲。
    #
    # 为什么不用 "*/5 * * * *"：
    # 实测（2026-10-17 建仓当晚）GitHub 对高频 cron 会降级调度 —— 配置写 5 分钟，
    # 实际只跑了 30 分钟一次，中间 20 分钟完全没有运行。而 "0 * * * *" 这种每小时
    # 一次的频率，GitHub 调度是可靠的（老仓库的 */30 实测误差仅 2 分钟）。
    # 所以把「2 分钟粒度」放进 job 内部实现，不再依赖 GitHub 的定时精度。
    # 公开仓库 Actions 分钟数不计费，长 job 没有成本。
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只打印不推送（调试用）"
        type: boolean
        default: false
      loops:
        description: "巡检轮数（默认 25 轮 × 2 分钟 ≈ 50 分钟，调试可填 1）"
        type: number
        default: 25

permissions:
  contents: write   # 回写好价节流状态 data/phone_deal_state.json

# 同一时间只跑一轮。上一轮还没结束就触发下一轮时，新的会在队列里等它跑完接上，
# 这样实际盯价是连续覆盖的，不会出现空档。
concurrency:
  group: deal-watch-git
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -q requests

      - name: 循环巡检（每 2 分钟一轮）
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          LOOPS: ${{ inputs.loops }}
        run: |
          # schedule 触发时 inputs 为空，用默认值
          LOOPS="${LOOPS:-25}"

          if [ "$DRY_RUN" = "true" ]; then
            echo "== DRY RUN（只跑 1 轮，不推送、不提交）=="
            python scripts/phone_deal.py --dry-run
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for i in $(seq 1 "$LOOPS"); do
            ROUND_START=$(date +%s)
            echo "::group::第 $i/$LOOPS 轮 $(date -u '+%H:%M:%S') UTC"
            python scripts/phone_deal.py || echo "::warning::第 $i 轮脚本异常，继续下一轮"
            echo "::endgroup::"

            # 每轮结束就把状态提交掉：万一这个长 job 中途被取消，已推送的记录不会丢，
            # 下一轮不会把同一条好价再推一次。没有变化时 save_state 不落盘，这里就跳过。
            git add data/phone_deal_state.json
            if git diff --cached --quiet; then
              echo "no state changes"
            else
              git commit -m "chore(deal): 更新好价节流状态 [skip ci]"
              if ! git push origin main; then
                sleep 5
                git pull --rebase origin main || git rebase --abort
                git push origin main || echo "::warning::状态回写失败，下一轮重新记账"
              fi
            fi

            # 按「本轮起点」对齐到 2 分钟整，抓取耗时不会让间隔漂移
            if [ "$i" -lt "$LOOPS" ]; then
              ELAPSED=$(( $(date +%s) - ROUND_START ))
              WAIT=$(( 120 - ELAPSED ))
              if [ "$WAIT" -gt 0 ]; then
                echo "本轮耗时 ${ELAPSED}s，等待 ${WAIT}s 后开始下一轮"
                sleep "$WAIT"
              else
                echo "::warning::本轮耗时 ${ELAPSED}s 已超过 2 分钟，立即开始下一轮"
              fi
            fi
          done
